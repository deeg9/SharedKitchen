<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mise - Onboarding Complete</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "tertiary-fixed": "#dde6d2",
              "surface-container": "#efeeea",
              "secondary-fixed": "#ffdcc3",
              "primary": "#334537",
              "on-secondary-container": "#663500",
              "surface-variant": "#e4e2de",
              "on-secondary-fixed": "#2f1500",
              "error": "#ba1a1a",
              "surface-container-lowest": "#ffffff",
              "on-background": "#1b1c1a",
              "on-error": "#ffffff",
              "outline-variant": "#c3c8c1",
              "on-surface": "#1b1c1a",
              "on-surface-variant": "#434843",
              "tertiary-fixed-dim": "#c0c9b7",
              "surface-bright": "#fbf9f5",
              "surface-container-high": "#eae8e4",
              "surface-dim": "#dbdad6",
              "on-primary-fixed-variant": "#394b3d",
              "on-primary": "#ffffff",
              "on-primary-fixed": "#0e1f13",
              "tertiary": "#3b4436",
              "secondary-fixed-dim": "#ffb77d",
              "on-primary-container": "#c0d5c2",
              "inverse-on-surface": "#f2f0ed",
              "surface-container-highest": "#e4e2de",
              "background": "#fbf9f5",
              "secondary": "#904d00",
              "error-container": "#ffdad6",
              "inverse-primary": "#b7ccb9",
              "outline": "#737872",
              "on-tertiary-container": "#c9d2bf",
              "on-tertiary": "#ffffff",
              "inverse-surface": "#30312e",
              "tertiary-container": "#535b4c",
              "secondary-container": "#fe932c",
              "on-secondary": "#ffffff",
              "on-secondary-fixed-variant": "#6e3900",
              "on-error-container": "#93000a",
              "primary-fixed": "#d3e8d5",
              "surface-container-low": "#f5f3ef",
              "surface": "#fbf9f5",
              "primary-fixed-dim": "#b7ccb9",
              "on-tertiary-fixed-variant": "#41493b",
              "primary-container": "#4a5d4e",
              "surface-tint": "#506354",
              "on-tertiary-fixed": "#161e12"
            },
            fontFamily: {
              "headline": ["Plus Jakarta Sans"],
              "body": ["Inter"],
              "label": ["Inter"]
            },
            borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            opacity: 0.8;
        }
        .bg-mesh-gradient {
            background-color: #fbf9f5;
            background-image: 
                radial-gradient(at 10% 20%, #f5f3ef 0px, transparent 50%),
                radial-gradient(at 90% 10%, #d3e8d5 0px, transparent 50%),
                radial-gradient(at 50% 50%, #fbf9f5 0px, transparent 50%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body min-h-screen flex flex-col items-center justify-center p-6 overflow-hidden bg-mesh-gradient">
<!-- Subtle Texture Overlays -->
<div aria-hidden="true" class="fixed inset-0 pointer-events-none opacity-20">
<div class="absolute top-[-10%] left-[-10%] w-[40%] h-[40%] bg-secondary-fixed rounded-full blur-[120px]"></div>
<div class="absolute bottom-[-5%] right-[-5%] w-[30%] h-[30%] bg-primary-fixed rounded-full blur-[100px]"></div>
</div>
<!-- Onboarding Step Counter (Suppressed Navigation but indicating progress) -->
<div class="fixed top-12 flex space-x-2">
<div class="h-1 w-8 bg-primary/20 rounded-full"></div>
<div class="h-1 w-8 bg-primary/20 rounded-full"></div>
<div class="h-1 w-8 bg-primary/20 rounded-full"></div>
<div class="h-1 w-8 bg-primary/20 rounded-full"></div>
<div class="h-1 w-8 bg-primary rounded-full"></div>
</div>
<!-- Main Content Canvas -->
<main class="relative w-full max-w-lg mx-auto flex flex-col items-center text-center">
<!-- Festive Illustration Placeholder -->
<div class="relative w-full aspect-square max-w-[320px] mb-12">
<!-- Asymmetric layered shapes for depth -->
<div class="absolute inset-0 bg-surface-container-low rounded-xl rotate-3 scale-95 opacity-50"></div>
<div class="absolute inset-0 bg-surface-container-lowest shadow-2xl rounded-xl -rotate-2 flex items-center justify-center p-8 border border-outline-variant/10">
<div class="relative w-full h-full flex flex-col items-center justify-center">
<!-- Illustrative Iconography -->
<div class="mb-4">
<span class="material-symbols-outlined text-8xl text-primary" style="font-variation-settings: 'FILL' 1;">restaurant_menu</span>
</div>
<!-- Floating Confetti Elements (Abstract visual interest) -->
<div class="absolute top-10 left-10 w-4 h-4 rounded-full bg-secondary rotate-45"></div>
<div class="absolute top-20 right-8 w-3 h-3 bg-tertiary-fixed rotate-12"></div>
<div class="absolute bottom-12 left-16 w-5 h-2 bg-primary-fixed-dim rounded-full -rotate-12"></div>
<div class="absolute bottom-20 right-12 w-4 h-4 rounded-sm bg-secondary-fixed-dim rotate-[30deg]"></div>
<div class="space-y-2 mt-4">
<div class="h-2 w-24 bg-surface-container-highest rounded-full mx-auto"></div>
<div class="h-2 w-16 bg-surface-container-highest rounded-full mx-auto opacity-60"></div>
</div>
</div>
</div>
<!-- Confetti Overlay Icons -->
<span class="material-symbols-outlined absolute -top-4 -right-4 text-secondary text-4xl rotate-12">celebration</span>
<span class="material-symbols-outlined absolute -bottom-6 -left-6 text-primary-container text-4xl -rotate-12">auto_awesome</span>
</div>
<!-- Typography Stack -->
<div class="space-y-4 mb-12">
<h1 class="font-headline text-4xl md:text-5xl font-extrabold tracking-tight text-primary leading-tight">
                You're all set!
            </h1>
<p class="font-body text-lg md:text-xl text-on-surface-variant max-w-xs mx-auto leading-relaxed">
                Your kitchen is ready. Let's start curating your culinary journey.
            </p>
</div>
<!-- Primary Action -->
<div class="w-full max-w-sm">
<button class="group relative w-full overflow-hidden bg-gradient-to-br from-primary to-primary-container text-on-primary font-headline font-bold py-5 px-8 rounded-full shadow-xl transition-all duration-300 active:scale-95 hover:shadow-2xl hover:-translate-y-1">
<span class="relative z-10 flex items-center justify-center gap-3">
                    Go to my kitchen
                    <span class="material-symbols-outlined text-xl transition-transform duration-300 group-hover:translate-x-1">arrow_forward</span>
</span>
<!-- Hover Glow -->
<div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
</button>
<p class="mt-8 font-label text-sm text-on-surface-variant/60 uppercase tracking-widest font-semibold">
                Welcome to Mise
            </p>
</div>
</main>
<!-- Contextual "Confetti" Background Details -->
<div class="fixed inset-0 pointer-events-none z-[-1]">
<!-- Abstract scattered dots mimicking organic confetti -->
<div class="absolute top-[15%] left-[20%] w-2 h-2 rounded-full bg-secondary-container/30"></div>
<div class="absolute top-[45%] right-[15%] w-3 h-3 rounded-full bg-primary/20"></div>
<div class="absolute bottom-[20%] left-[10%] w-2 h-2 rounded-full bg-tertiary/30"></div>
<div class="absolute bottom-[35%] right-[25%] w-4 h-4 rounded-full bg-secondary-fixed-dim/40"></div>
<div class="absolute top-[70%] left-[30%] w-2 h-2 rounded-full bg-primary-fixed/50"></div>
</div>
</body></html>
