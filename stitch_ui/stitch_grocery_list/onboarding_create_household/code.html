<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mise - Create Household</title>

                        "outline-variant": "#c3c8c1",
                        "on-surface": "#1b1c1a",
                        "on-surface-variant": "#434843",
                        "tertiary-fixed-dim": "#c0c9b7",
                        "surface-bright": "#fbf9f5",
                        "surface-container-high": "#eae8e4",
                        "surface-dim": "#dbdad6",
                        "on-primary-fixed-variant": "#394b3d",
                        "on-primary": "#ffffff",
                        "on-primary-fixed": "#0e1f13",

                        "on-primary-container": "#c0d5c2",

                        "outline": "#737872",
                        "on-tertiary-container": "#c9d2bf",

                        "inverse-surface": "#30312e",

                        "on-secondary-fixed-variant": "#6e3900",
                        "on-error-container": "#93000a",
                        "primary-fixed": "#d3e8d5",
                        "surface-container-low": "#f5f3ef",
                        "surface": "#fbf9f5",
                        "primary-fixed-dim": "#b7ccb9",
                        "on-tertiary-fixed-variant": "#41493b",
                        "primary-container": "#4a5d4e",
                        "surface-tint": "#506354",
                        "on-tertiary-fixed": "#161e12"
                    },
                    fontFamily: {
                        "headline": ["Plus Jakarta Sans"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            background: rgba(251, 249, 245, 0.7);
            backdrop-filter: blur(12px);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body text-on-surface min-h-screen flex flex-col">
<!-- Header / TopAppBar Alignment -->
<header class="fixed top-0 z-50 w-full bg-[#fbf9f5]/80 backdrop-blur-md flex justify-between items-center px-6 py-4 max-w-screen-xl mx-auto">
<div class="flex items-center gap-4">
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
</div>
<div class="font-headline tracking-tighter text-xl font-bold text-primary">
            The Culinary Curator
        </div>
<div class="w-10 h-10 flex items-center justify-center rounded-full bg-surface-container-high overflow-hidden">
<img alt="Profile" class="w-full h-full object-cover" data-alt="Close up of a friendly user profile avatar" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBW3V1bdiGARliAK12k6uOozn2blBkqZKb-7af63pfX376k5lbwVY5GIF1KUhhuz8HsbLx-Ha2eiSb60XCjZyRIy3OiF4g3dCuM5e8-ochkbQ1abfaKfNnz28rvPFSTsUqnmuYerTESWv-vAZ8Z9_SA-bUe7Ir1pADRNyoIicEal6MVy2wmUSLu7alxMquvZhcrrvSeYxhAd1mBCnWsOAswbqZKVsCO40kw76W_apFr_vCSwJ6xuRjbHBBnnWuxIicKqq1jsXEDQ26W"/>
</div>
</header>
<main class="flex-grow flex flex-col items-center justify-center px-6 pt-24 pb-32 max-w-md mx-auto w-full">
<!-- Progress Indicator -->
<div class="flex gap-2 mb-12">
<div class="h-1.5 w-12 rounded-full bg-primary-fixed"></div>
<div class="h-1.5 w-12 rounded-full bg-primary shadow-sm"></div>
<div class="h-1.5 w-12 rounded-full bg-surface-container-highest"></div>
</div>
<!-- Illustration Section -->
<div class="relative w-full aspect-square mb-10 overflow-hidden rounded-lg bg-surface-container-low flex items-center justify-center">
<div class="absolute inset-0 opacity-20 bg-[radial-gradient(circle_at_50%_50%,_var(--tw-gradient-from)_0%,_transparent_100%)] from-primary"></div>
<img alt="Modern Kitchen" class="w-full h-full object-cover mix-blend-multiply opacity-90 scale-105 transform -rotate-1" data-alt="A bright modern kitchen with sage green cabinets and marble countertops" src="https://lh3.googleusercontent.com/aida-public/AB6AXuC78exlE_ppqmgSLprpNoD91MxMIF20_8WwCOjVMjqvR-dM0CNyeSm2JbiJ17hgeVF3eLBqE-oeTNescus-7dMT2ItVDwXtPSn8NrmMRp2ekbgaXiRDJSUPqKvFiNQBjaSRzKNMLzQ1Ntct_o6v0XqorqRe3WcW7qNn2_9CJKlxQAqgmI-LhDtTYGwGagKNLdkE2cF8p5CXycPPD95TXJgbB68lGRPEjXecVZ0ljPETQ21WCOGVF-ZXAbnb7b_ykSecfx1zIZVxSiIG"/>
<!-- Floating Decorative Elements -->
<div class="absolute top-4 right-4 p-3 glass-panel rounded-xl shadow-sm transform rotate-3">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">restaurant</span>
</div>
<div class="absolute bottom-8 left-6 p-3 glass-panel rounded-xl shadow-sm transform -rotate-6">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">potted_plant</span>
</div>
</div>
<!-- Headline -->
<div class="text-center mb-10">
<h1 class="font-headline text-3xl font-extrabold tracking-tight text-on-surface mb-3 leading-tight">
                Name your <span class="text-primary italic">Kitchen</span>
</h1>
<p class="text-on-surface-variant text-base leading-relaxed">
                Whether it's just you or a bustling family of foodies, give your household a name to get started.
            </p>
</div>
<!-- Input Section -->
<div class="w-full space-y-6">
<div class="group relative">
<label class="block text-xs font-label font-semibold text-primary uppercase tracking-widest mb-2 ml-1" for="household-name">
                    Household Name
                </label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border-none rounded-lg px-5 py-4 text-on-surface placeholder-on-surface-variant/40 focus:ring-0 transition-all shadow-[0_4px_20px_rgba(0,0,0,0.02)]" id="household-name" placeholder="e.g., Diego &amp; Mel's Kitchen" type="text"/>
<div class="absolute bottom-0 left-0 w-full h-0.5 bg-primary transform scale-x-0 group-focus-within:scale-x-100 transition-transform duration-300 ease-out"></div>
</div>
</div>
<!-- Tip Card -->
<div class="bg-tertiary-fixed/30 p-4 rounded-lg flex gap-4 items-start border border-tertiary-fixed/20">
<span class="material-symbols-outlined text-tertiary" style="font-variation-settings: 'FILL' 1;">info</span>
<p class="text-sm text-on-tertiary-fixed-variant leading-tight">
                    You can invite your roommates or family members to join this kitchen in the next step.
                </p>
</div>
</div>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full p-6 bg-gradient-to-t from-background via-background to-transparent pt-12">
<div class="max-w-md mx-auto flex flex-col items-center">
<button class="w-full py-4 px-8 rounded-full bg-gradient-to-br from-primary to-primary-container text-on-primary font-headline font-bold text-lg shadow-xl hover:shadow-2xl active:scale-95 transition-all flex items-center justify-center gap-2 group">
                Next
                <span class="material-symbols-outlined transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
<p class="mt-4 text-xs font-label text-on-surface-variant/60">
                Step 2 of 4
            </p>
</div>
</div>
</body></html>
