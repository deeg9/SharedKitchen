appId: com.sharedkitchen.app
---
- launchApp:
    clearState: true
- assertVisible: "Create Account"
- tapOn:
    id: "sign-up-email-input"
- inputText: "testuser+${Date.now()}@example.com"
- tapOn:
    id: "sign-up-password-input"
- inputText: "***REMOVED***"
- tapOn:
    id: "sign-up-confirm-password-input"
- inputText: "***REMOVED***"
- tapOn:
    id: "sign-up-submit-button"
- extendedWaitUntil:
    visible:
      text: ".*Welcome.*|.*Check your email.*"
    timeout: 10000
