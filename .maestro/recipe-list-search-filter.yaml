appId: com.sharedkitchen.app
---
# Recipe List Search & Filter Flow
# Validates recipe list browsing, search filtering, empty state, and category filter button.
# Assumes the user is already logged in and at least one recipe exists.
# Covers: RLIST-01 (grid), RLIST-02 (search), RLIST-03 (category filter button), RLIST-04 (empty state)
#
# Note: The category dropdown renders behind the recipe grid due to parent zIndex:-1 in RecipeGrid.
# We verify the Category button is tappable but cannot interact with the dropdown overlay in Maestro.
# The filter logic itself is covered by unit tests in Plan 01.

- launchApp

# Navigate to Recipes tab
- tapOn:
    id: "recipes-tab"

# Wait for recipes screen to load (search input confirms grid rendered)
- extendedWaitUntil:
    visible:
      id: "recipe-search-input"
    timeout: 10000

# RLIST-01: Confirm 2-column grid loaded (search input presence confirms RecipeGrid rendered)
- assertVisible:
    id: "recipe-search-input"

# RLIST-03: Category filter button is present and tappable
- scrollUntilVisible:
    element:
      text: ".*Category.*"
    direction: DOWN
    timeout: 8000
    visibilityPercentage: 50

- assertVisible:
    text: ".*Category.*"

# Tap Category to verify it responds (toggles dropdown state)
- tapOn:
    text: ".*Category.*"

# Tap Category again to close dropdown state
- tapOn:
    text: ".*Category.*"
    retryTapIfNoChange: false

# Verify Cost and Time filter buttons also visible
- assertVisible:
    text: ".*Cost.*"

- assertVisible:
    text: ".*Time.*"

# RLIST-02: Search by name -- type a non-matching query to trigger empty state
- tapOn:
    id: "recipe-search-input"
- inputText: "zzznonexistent999"

# RLIST-04: Assert empty state appears
- extendedWaitUntil:
    visible:
      text: "No recipes found"
    timeout: 5000

- assertVisible:
    text: "No recipes found"

- assertVisible:
    text: "Try adjusting your search or filters"

# Clear search to restore results
- tapOn:
    id: "recipe-search-input"
- eraseText: 20

# Dismiss keyboard
- hideKeyboard

# Verify recipes reappear after clearing search
- extendedWaitUntil:
    visible:
      id: "recipe-search-input"
    timeout: 5000
