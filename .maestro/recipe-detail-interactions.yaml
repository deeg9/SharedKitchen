appId: com.sharedkitchen.app
---
# Recipe Detail Interactions Flow
# Validates recipe detail rating area, favorite toggle, note submission,
# ingredient scale switching, and ingredient checklist interaction.
# Assumes the user is already logged in and at least one recipe exists.
# Covers: RDETAIL-01 (hero/metadata), RDETAIL-02 (tags), RDETAIL-03 (rating),
#          RDETAIL-04 (favorite), RDETAIL-05 (notes), RDETAIL-06 (scaling),
#          RDETAIL-07 (ingredient checklist)

- launchApp
- runFlow: "helpers/login.yaml"

# Navigate to Recipes tab
- tapOn:
    id: "recipes-tab"

# Wait for recipes to load
- extendedWaitUntil:
    visible:
      id: "recipe-search-input"
    timeout: 10000

# Tap a recipe card by name (partial match for wrapped text)
- tapOn:
    text: ".*Heritage Basil Pesto.*"
    retryTapIfNoChange: false

# Wait for detail to load
- extendedWaitUntil:
    visible:
      text: "Ingredients"
    timeout: 10000

# RDETAIL-01: Hero image and metadata pills
# Assert SERVES metadata pill is visible (always present on all recipes)
- scrollUntilVisible:
    element:
      text: "SERVES"
    direction: DOWN
    timeout: 8000

- assertVisible:
    text: "SERVES"

# RDETAIL-03: Star rating area -- verify the reviews pill is visible
- swipe:
    direction: DOWN
    duration: 400

- scrollUntilVisible:
    element:
      text: ".*reviews.*"
    direction: DOWN
    timeout: 8000

- assertVisible:
    text: ".*reviews.*"

# RDETAIL-04: Favorite toggle
- scrollUntilVisible:
    element:
      id: "recipe-detail-favorite-button"
    direction: DOWN
    timeout: 8000

- tapOn:
    id: "recipe-detail-favorite-button"

# Assert still visible after toggle
- assertVisible:
    id: "recipe-detail-favorite-button"

# Tap again to un-favorite (restore original state)
- tapOn:
    id: "recipe-detail-favorite-button"
    retryTapIfNoChange: false

# RDETAIL-06: Scale ingredients -- scroll to Ingredients section
- swipe:
    direction: DOWN
    duration: 400

- scrollUntilVisible:
    element:
      text: "Ingredients"
    direction: DOWN
    timeout: 8000

- assertVisible:
    text: "Ingredients"

# Assert default scale button is visible
- assertVisible:
    text: ".*x1.*"

# Tap x2 scale button
- tapOn:
    text: "x2"

# Tap x3 scale button to verify multiple scales work
- tapOn:
    text: "x3"

# Tap back to x1
- tapOn:
    text: ".*x1.*"

# RDETAIL-07: Ingredient checklist -- tap first ingredient row
# Ingredients are rendered as Pressable rows; tapping toggles strikethrough
# We can't verify visual strikethrough in Maestro but confirm no crash on tap
- tapOn:
    text: ".*"
    index: 6
    retryTapIfNoChange: false

# RDETAIL-05: Household notes section
- scrollUntilVisible:
    element:
      text: "Household Tips"
    direction: DOWN
    timeout: 8000

- assertVisible:
    text: "Household Tips"

# Tap note input and type a test note
- tapOn:
    id: "recipe-detail-note-input"

- inputText: "Test household tip from Maestro"

# Submit note via keyboard return key
- pressKey: Enter

# Dismiss keyboard to see the notes list
- hideKeyboard

# Scroll to find the submitted note (it appears above the input)
- scrollUntilVisible:
    element:
      text: ".*Test household tip from Maestro.*"
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50

- assertVisible:
    text: ".*Test household tip from Maestro.*"
