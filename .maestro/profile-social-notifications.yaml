appId: com.sharedkitchen.app
name: "Profile Social Notifications"
---
# Profile Social Notifications
# Navigates to profile, finds the social notifications toggle.

- launchApp
- runFlow: "helpers/login.yaml"

# Navigate to Profile tab
- tapOn:
    id: "profile-tab"

# Wait for profile to load
- extendedWaitUntil:
    visible:
      text: "Edit Profile"
    timeout: 5000

# Scroll down to find the social notifications toggle
- scrollUntilVisible:
    element:
      id: "social-notifications-toggle"
    direction: DOWN
    timeout: 5000

# Verify the toggle is visible
- assertVisible:
    id: "social-notifications-toggle"
