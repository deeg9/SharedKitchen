appId: com.mise.app
---
- launchApp:
    clearState: true
# Sign up first to trigger onboarding
- assertVisible: "Create Account"
- tapOn:
    id: "sign-up-email-input"
- inputText: "onboard+${Date.now()}@example.com"
- tapOn:
    id: "sign-up-password-input"
- inputText: "***REMOVED***"
- tapOn:
    id: "sign-up-confirm-password-input"
- inputText: "***REMOVED***"
- tapOn:
    id: "sign-up-submit-button"
# Step 1: Welcome
- assertVisible:
    text: ".*Welcome.*SharedKitchen.*"
    timeout: 10000
- tapOn:
    id: "onboarding-welcome-continue"
# Step 2: Create Household
- tapOn:
    id: "onboarding-household-name-input"
- inputText: "Test Kitchen"
- tapOn:
    id: "onboarding-household-continue"
# Step 3: Invite Members (skip)
- assertVisible:
    text: ".*Invite.*"
    timeout: 5000
- tapOn:
    id: "onboarding-invite-skip"
# Step 4: Add Recipes (continue)
- assertVisible:
    text: ".*recipe.*"
    timeout: 5000
- tapOn:
    id: "onboarding-recipes-continue"
# Step 5: Plan Week (continue)
- assertVisible:
    text: ".*Plan.*meals.*"
    timeout: 5000
- tapOn:
    id: "onboarding-plan-continue"
# Step 6: All Set
- assertVisible:
    text: ".*all set.*"
    timeout: 5000
- tapOn:
    id: "onboarding-allset-done"
# Should land on main app
- assertVisible:
    text: ".*Plan.*|.*Recipes.*"
    timeout: 5000
