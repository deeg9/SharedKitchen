appId: com.sharedkitchen.app
---
# Vision Camera Permission Flow
# Tests: Camera FAB on Kitchen tab, CameraSheet opens with options.

- launchApp

# Wait for app to fully load
- extendedWaitUntil:
    visible:
      id: "grocery-tab"
    timeout: 15000

# Navigate to Kitchen tab
- tapOn:
    id: "grocery-tab"

# Verify camera FAB is visible
- assertVisible:
    id: "camera-fab"

# Tap the camera FAB
- tapOn:
    id: "camera-fab"

# Wait for bottom sheet to animate in — use accessibility label for reliable matching
- extendedWaitUntil:
    visible:
      text: "Take a photo with camera"
    timeout: 8000

# Verify both camera options are accessible
- assertVisible:
    text: "Take a photo with camera"

- assertVisible:
    text: "Choose photo from gallery"
