appId: com.sharedkitchen.app
---
# Vision Meal Logging Flow
# Tests: Same entry point as recipe discovery (Shopping List segment).
# After dish identification (manual step), verifies both action buttons
# and meal slot picker.

- launchApp
- runFlow: "helpers/login.yaml"

# Wait for app to fully load
- extendedWaitUntil:
    visible:
      id: "grocery-tab"
    timeout: 15000

# Navigate to Kitchen tab
- tapOn:
    id: "grocery-tab"

# Shopping List segment for identify intent
- tapOn:
    text: "Shopping List"

# Verify camera FAB
- assertVisible:
    id: "camera-fab"

# Tap camera FAB
- tapOn:
    id: "camera-fab"

# CameraSheet should open
- extendedWaitUntil:
    visible:
      text: "Take a photo with camera"
    timeout: 8000

- assertVisible:
    text: "Choose photo from gallery"

# After manual photo selection and AI processing, the flow continues:
# DishIdentifiedSheet → "Find Recipes" + "Log as Meal" buttons
# MealSlotPickerSheet → day chips + meal slot buttons
# These require deployed Edge Functions + real photo, tested manually.
