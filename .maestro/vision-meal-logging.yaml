appId: com.sharedkitchen.app
---
# Vision Meal Logging Flow
# Tests: After dish identification, "Log as Meal" opens MealSlotPickerSheet,
# user selects day + meal type, meal appears on Plan tab.
# Requires: Camera permission granted, Edge Functions deployed.
# Note: Stops at camera picker. Post-identification steps documented below.

- launchApp

# Navigate to Kitchen tab
- tapOn:
    id: "kitchen-tab"

# Shopping List segment for identify intent
- tapOn:
    text: "Shopping List"

# Tap camera FAB
- tapOn:
    id: "camera-fab"

# CameraSheet opens
- extendedWaitUntil:
    visible:
      text: "Add a Photo"
    timeout: 5000

- tapOn:
    id: "camera-sheet-choose-gallery"

