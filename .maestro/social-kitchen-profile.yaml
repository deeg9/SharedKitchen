appId: com.sharedkitchen.app
name: "Kitchen Profile View"
---
# Kitchen Profile View
# Navigates to the user's own kitchen profile via Profile tab kitchen row
# and verifies profile card elements.
# Assumes user is logged in and has at least one kitchen.

- launchApp

# Navigate to Profile tab
- tapOn:
    id: "profile-tab"

# Wait for profile to load
- extendedWaitUntil:
    visible:
      text: "Your Kitchens"
    timeout: 5000

# Tap on the first kitchen row to open its profile
# Kitchen rows have dynamic testIDs, so tap by text on the kitchen name
- tapOn:
    text: ".*"
    index: 0
    retryTapIfNoChange: false

# Wait for kitchen profile screen to load
- extendedWaitUntil:
    visible:
      id: "kitchen-profile-name"
    timeout: 5000

# Verify kitchen profile card elements are visible
- assertVisible:
    id: "kitchen-profile-name"

- assertVisible:
    id: "kitchen-profile-avatar"

- assertVisible:
    id: "kitchen-profile-recipe-count"

- assertVisible:
    id: "kitchen-profile-follower-count"

- assertVisible:
    id: "kitchen-profile-following-count"

# Verify edit button is available (own profile)
- assertVisible:
    id: "kitchen-profile-edit-button"

# Close the profile screen
- tapOn:
    id: "kitchen-profile-close"
