appId: com.sharedkitchen.app
name: "Kitchen Profile View"
---
# Kitchen Profile View
# Opens kitchen search, searches for own kitchen, taps result to view profile.

- launchApp
- runFlow: "helpers/login.yaml"

# Navigate to Plan tab
- tapOn:
    id: "plan-tab"

# Open kitchen search
- tapOn:
    id: "plan-search-icon"

# Wait for search input
- extendedWaitUntil:
    visible:
      id: "kitchen-search-input"
    timeout: 3000

# Search for own kitchen
- tapOn:
    id: "kitchen-search-input"
- inputText: "Test Kitchen"

# Wait for search results and tap the first result
- extendedWaitUntil:
    visible:
      text: "Test Kitchen"
    timeout: 5000

- tapOn:
    text: "Test Kitchen"
    index: 0

# Wait for kitchen profile screen to load
- extendedWaitUntil:
    visible:
      id: "kitchen-profile-name"
    timeout: 5000

# Verify kitchen profile card elements are visible
- assertVisible:
    id: "kitchen-profile-name"

- assertVisible:
    id: "kitchen-profile-avatar"

- assertVisible:
    id: "kitchen-profile-recipe-count"

- assertVisible:
    id: "kitchen-profile-follower-count"

- assertVisible:
    id: "kitchen-profile-following-count"

# Verify edit button is available (own profile)
- assertVisible:
    id: "kitchen-profile-edit-button"

# Close the profile screen
- tapOn:
    id: "kitchen-profile-close"
