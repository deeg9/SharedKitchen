appId: com.sharedkitchen.app
name: "Profile View and Edit"
---
# Profile View and Edit Flow
# Opens profile tab, verifies sections, taps edit profile button.

- launchApp
- runFlow: "helpers/login.yaml"

# Navigate to Profile tab
- tapOn:
    id: "profile-tab"

# Wait for profile to load
- extendedWaitUntil:
    visible:
      text: "Edit Profile"
    timeout: 5000

# Verify key profile sections are visible
- assertVisible:
    text: "Your Kitchens"

# Scroll to verify Members section is visible
- scrollUntilVisible:
    element:
      text: "Members"
    direction: DOWN
    timeout: 5000

- assertVisible:
    text: "Members"

# Scroll back up to Edit Profile
- scrollUntilVisible:
    element:
      id: "profile-edit-button"
    direction: UP
    timeout: 5000

# Verify action buttons are present
- assertVisible:
    id: "profile-edit-button"

# Scroll down to sign out button
- scrollUntilVisible:
    element:
      id: "profile-sign-out-button"
    direction: DOWN
    timeout: 5000

- assertVisible:
    id: "profile-sign-out-button"

# Tap edit profile
- scrollUntilVisible:
    element:
      id: "profile-edit-button"
    direction: UP
    timeout: 5000

- tapOn:
    id: "profile-edit-button"

# Verify edit profile screen opens
- extendedWaitUntil:
    visible:
      text: ".*"
    timeout: 3000
