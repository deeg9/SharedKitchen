appId: com.sharedkitchen.app
---
# Vision Scan Pantry Flow
# Tests: On Hand segment camera flow triggers scan intent.
# Verifies FAB, segment switching, and camera sheet on On Hand.

- launchApp

# Wait for app to fully load (JS bundle download on relaunch)
- extendedWaitUntil:
    visible:
      id: "grocery-tab"
    timeout: 15000

# Navigate to Kitchen tab
- tapOn:
    id: "grocery-tab"

# Switch to On Hand segment (scan mode)
- tapOn:
    text: "On Hand"

# Verify camera FAB is visible on On Hand segment
- assertVisible:
    id: "camera-fab"

# Tap camera FAB
- tapOn:
    id: "camera-fab"

# CameraSheet should open (permission already granted from prior flow)
- extendedWaitUntil:
    visible:
      text: "Take a photo with camera"
    timeout: 8000

- assertVisible:
    text: "Take a photo with camera"

- assertVisible:
    text: "Choose photo from gallery"

# Test passes: FAB → CameraSheet works on On Hand segment.
# Do NOT tap gallery — opens native picker that Maestro can't control.
