appId: com.sharedkitchen.app
---
# Vision Scan Pantry Flow
# Tests: Camera FAB on On Hand segment triggers scan intent,
# ScanReviewScreen renders with items, user can interact with review.
# Requires: Camera permission already granted, Edge Function deployed,
# GEMINI_API_KEY provisioned. Uses gallery picker with a food photo.
# Note: Stops at camera picker since Maestro can't select gallery photos.
# For full E2E: manually pick a fridge photo, then this verifies the review screen.

- launchApp

# Navigate to Kitchen tab
- tapOn:
    id: "grocery-tab"

# Switch to On Hand segment (scan mode)
- tapOn:
    text: "On Hand"

# Verify camera FAB is visible on On Hand
- assertVisible:
    id: "camera-fab"

# Tap camera FAB
- tapOn:
    id: "camera-fab"

# If permission already granted, CameraSheet opens directly
- extendedWaitUntil:
    visible:
      text: "Add a Photo"
    timeout: 5000

# Tap "Choose from Gallery" (easier for testing than camera)
- tapOn:
    id: "camera-sheet-choose-gallery"

# -- MANUAL STEP: Select a photo of fridge/pantry from gallery --
# Maestro cannot interact with the native photo picker.
# The flow pauses here. For automated E2E, you would need to:
# 1. Pre-seed a test photo in the simulator gallery
# 2. Use Maestro's `tapOn` with coordinates to select it
# OR test from the scan review screen directly by mocking the camera result.
