appId: com.sharedkitchen.app
---
# Vision Recipe Discovery Flow
# Tests: Shopping List segment camera flow triggers identify intent.
# Verifies FAB and camera sheet on Shopping List.

- launchApp
- runFlow: "helpers/login.yaml"

# Wait for app to fully load
- extendedWaitUntil:
    visible:
      id: "grocery-tab"
    timeout: 15000

# Navigate to Kitchen tab
- tapOn:
    id: "grocery-tab"

# Ensure Shopping List segment is active (identify mode)
- tapOn:
    text: "Shopping List"

# Verify camera FAB is visible
- assertVisible:
    id: "camera-fab"

# Tap camera FAB
- tapOn:
    id: "camera-fab"

# CameraSheet should open
- extendedWaitUntil:
    visible:
      text: "Take a photo with camera"
    timeout: 8000

- assertVisible:
    text: "Take a photo with camera"

- assertVisible:
    text: "Choose photo from gallery"
